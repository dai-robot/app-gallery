<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Syndication Burger thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.55" stop-color="#ffe8c8"/>
      <stop offset="1" stop-color="#f4c070"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b4513"/>
      <stop offset="0.5" stop-color="#c45c26"/>
      <stop offset="1" stop-color="#e87830"/>
    </linearGradient>
    <linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd080"/>
      <stop offset="1" stop-color="#e8a838"/>
    </linearGradient>
    <linearGradient id="bunBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b040"/>
      <stop offset="1" stop-color="#d89028"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8c8c8"/>
      <stop offset="0.5" stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#b0b0b0"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="55%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8b4513" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <rect width="960" height="600" fill="url(#spot)"/>

  <!-- diner stripes -->
  <rect x="0" y="520" width="960" height="80" fill="#e87830" opacity="0.18"/>
  <rect x="0" y="548" width="960" height="8" fill="#c45c26" opacity="0.25"/>

  <!-- title bar -->
  <rect x="120" y="36" width="720" height="76" rx="20" fill="rgba(255,255,255,0.72)" stroke="rgba(196,92,38,0.35)" stroke-width="3"/>
  <text x="480" y="88" text-anchor="middle" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="42" font-weight="900" fill="url(#title)">Syndication Burger</text>

  <!-- score badge -->
  <g transform="translate(760 48)">
    <rect x="0" y="0" width="120" height="44" rx="22" fill="rgba(255,215,0,0.35)" stroke="rgba(218,165,32,0.6)" stroke-width="2"/>
    <text x="60" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="800" fill="#b8860b"> 3</text>
  </g>

  <!-- combo badge -->
  <g transform="translate(80 48)">
    <rect x="0" y="0" width="130" height="44" rx="22" fill="rgba(124,179,66,0.28)" stroke="rgba(85,139,47,0.5)" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="18" font-weight="800" fill="#33691e">COMBO x5</text>
  </g>

  <!-- tray -->
  <g filter="url(#shadow)">
    <ellipse cx="480" cy="468" rx="210" ry="28" fill="url(#tray)"/>
    <ellipse cx="480" cy="458" rx="196" ry="22" fill="#d8d8d8"/>
    <rect x="284" y="448" width="392" height="18" rx="4" fill="#c0c0c0"/>
  </g>

  <!-- burger stack -->
  <g filter="url(#shadow)" transform="translate(480 340)">
    <!-- bottom bun -->
    <ellipse cx="0" cy="88" rx="118" ry="34" fill="url(#bunBot)"/>
    <ellipse cx="0" cy="78" rx="108" ry="22" fill="#f5c060"/>

    <!-- patty -->
    <ellipse cx="0" cy="58" rx="112" ry="22" fill="#5d3a1a"/>
    <ellipse cx="0" cy="52" rx="100" ry="14" fill="#7a4a22"/>

    <!-- cheese -->
    <path d="M-108 38 Q-60 52 0 44 Q60 52 108 38 L108 48 Q60 58 0 50 Q-60 58 -108 48 Z" fill="#ffc107"/>

    <!-- lettuce -->
    <path d="M-115 22 Q-70 8 -30 18 Q0 6 30 18 Q70 8 115 22 L108 32 Q70 24 0 30 Q-70 24 -108 32 Z" fill="#7cb342"/>
    <path d="M-100 14 Q-50 2 0 12 Q50 2 100 14" fill="none" stroke="#558b2f" stroke-width="3" opacity="0.5"/>

    <!-- tomato -->
    <ellipse cx="0" cy="8" rx="96" ry="14" fill="#e53935" opacity="0.9"/>
    <ellipse cx="0" cy="4" rx="88" ry="8" fill="#ef5350"/>

    <!-- top bun -->
    <ellipse cx="0" cy="-28" rx="128" ry="52" fill="url(#bunTop)"/>
    <ellipse cx="0" cy="-48" rx="118" ry="38" fill="#ffd080"/>
    <!-- sesame -->
    <ellipse cx="-40" cy="-52" rx="6" ry="3" fill="#fff8dc" opacity="0.85" transform="rotate(-20 -40 -52)"/>
    <ellipse cx="10" cy="-58" rx="5" ry="3" fill="#fff8dc" opacity="0.85" transform="rotate(15 10 -58)"/>
    <ellipse cx="48" cy="-50" rx="6" ry="3" fill="#fff8dc" opacity="0.85" transform="rotate(-8 48 -50)"/>
    <ellipse cx="-10" cy="-42" rx="5" ry="2.5" fill="#fff8dc" opacity="0.75"/>
    <ellipse cx="30" cy="-44" rx="4" ry="2" fill="#fff8dc" opacity="0.75"/>
  </g>

  <!-- falling ingredient -->
  <g opacity="0.85" transform="translate(620 180) rotate(12)">
    <ellipse cx="0" cy="0" rx="52" ry="18" fill="#7cb342"/>
    <path d="M-52 -2 Q-20 -14 0 -6 Q20 -14 52 -2" fill="none" stroke="#558b2f" stroke-width="2"/>
  </g>

  <!-- drag hint arrows -->
  <g fill="none" stroke="#c45c26" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <path d="M180 420 L140 420 M150 400 L140 420 L150 440"/>
    <path d="M780 420 L820 420 M810 400 L820 420 L810 440"/>
  </g>
  <text x="480" y="545" text-anchor="middle" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="22" font-weight="700" fill="#8b4513" opacity="0.65">æóÉéÃ°gÈìü’ÕKWfM
RˆF</text>

  <!-- neat stack badge -->
  <g transform="translate(330 500)">
    <rect x="0" y="0" width="300" height="40" rx="20" fill="rgba(255,255,255,0.55)" stroke="rgba(196,92,38,0.3)" stroke-width="2"/>
    <text x="150" y="27" text-anchor="middle" font-family="'Yu Gothic', 'Meiryo', sans-serif" font-size="17" font-weight="800" fill="#c45c26">ŽWD¢í±ü·çó</text>
  </g>
</svg>
